name: Production CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  backend-ci:
    name: Backend CI & Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Validate backend entry point syntax
        run: node -c src/server.js

  frontend-ci:
    name: Frontend Build & Asset Compilation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend production bundle
        run: npm run build

      - name: Verify build artifacts
        run: |
          if [ ! -f dist/index.html ]; then
            echo "Error: dist/index.html not generated!"
            exit 1
          fi
          echo "Frontend build successfully generated."

  deploy-status:
    name: Production Deployment Status
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment readiness
        run: |
          echo "All production checks passed successfully."
          echo "Ready for Render automated continuous deployment."

      - name: Trigger Render Deploy Hook (Optional)
        if: ${{ env.RENDER_DEPLOY_HOOK_URL != '' }}
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering Render webhook deploy..."
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"
